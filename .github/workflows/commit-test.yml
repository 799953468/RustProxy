name: Commit Test

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'

jobs:
  verify:
    name: Build and test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore RustProxy.slnx --locked-mode --disable-build-servers

      - name: Build
        run: dotnet build RustProxy.slnx --configuration Release --no-restore --disable-build-servers -m:1 -p:UseSharedCompilation=false

      - name: Run regression tests
        run: dotnet test RustProxy.slnx --configuration Release --no-build --no-restore --disable-build-servers --logger "trx;LogFilePrefix=tests" --results-directory TestResults

      - name: Check whitespace
        run: git diff --check

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.runner }}
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14
