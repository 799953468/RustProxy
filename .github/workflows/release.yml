name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/commit-test.yml

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: win-x64
            runner: windows-latest
          - rid: osx-arm64
            runner: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Extract current release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: sh scripts/release-notes.sh "$GITHUB_REF_NAME" > RELEASE_NOTES.md

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Build and publish
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore RustProxy.slnx --locked-mode
          output="artifacts/${{ matrix.rid }}"
          mkdir -p "$output/server" "$output/cli"
          dotnet publish RustProxy.Server/RustProxy.Server.csproj \
            -c Release -r "${{ matrix.rid }}" --self-contained false \
            --no-restore -o "$output/server"
          dotnet publish RustProxy.Cli/RustProxy.Cli.csproj \
            -c Release -r "${{ matrix.rid }}" --self-contained false \
            --no-restore -o "$output/cli"

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "RustProxy-${{ matrix.rid }}.zip" "${{ matrix.rid }}/*" >/dev/null
          else
            zip -qr "RustProxy-${{ matrix.rid }}.zip" "${{ matrix.rid }}"
          fi
          package="RustProxy-${{ matrix.rid }}.zip"
          if command -v sha256sum >/dev/null; then
            sha256sum "$package" > "$package.sha256"
          else
            shasum -a 256 "$package" > "$package.sha256"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RustProxy-${{ matrix.rid }}
          path: artifacts/RustProxy-${{ matrix.rid }}.zip*
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && github.server_url == 'https://github.com'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/RustProxy-${{ matrix.rid }}.zip*
          body_path: RELEASE_NOTES.md
          generate_release_notes: false

      - name: Attach to Gitea Release
        if: startsWith(github.ref, 'refs/tags/') && github.server_url != 'https://github.com'
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GITEA_TOKEN" ]]; then
            echo "Set the GITEA_TOKEN repository secret to upload release assets" >&2
            exit 1
          fi
          api_url="${{ github.api_url }}/repos/${{ github.repository }}/releases"
          payload=$(jq -n --arg tag "$GITHUB_REF_NAME" --rawfile body RELEASE_NOTES.md \
            '{tag_name:$tag,name:$tag,body:$body,draft:false,prerelease:false}')
          release=$(curl --fail --silent --show-error \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$api_url") || release=$(curl --fail --silent --show-error \
            -H "Authorization: token $GITEA_TOKEN" \
            "$api_url/tags/${GITHUB_REF_NAME}")
          upload_url=$(printf '%s' "$release" | jq -r '.upload_url // empty' | sed 's/{?name,label}//')
          if [[ -z "$upload_url" ]]; then
            echo "Unable to find Gitea release upload URL" >&2
            exit 1
          fi
          for file in "artifacts/RustProxy-${{ matrix.rid }}.zip" "artifacts/RustProxy-${{ matrix.rid }}.zip.sha256"; do
            curl --fail --silent --show-error \
              -H "Authorization: token $GITEA_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file" \
              "$upload_url?name=${file##*/}"
          done
