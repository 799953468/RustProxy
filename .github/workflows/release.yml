name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: win-x64
            runner: windows-latest
          - rid: osx-arm64
            runner: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          include-prerelease: true

      - name: Build and publish
        shell: bash
        run: |
          set -euo pipefail
          output="artifacts/${{ matrix.rid }}"
          mkdir -p "$output/server" "$output/cli"
          dotnet publish RustProxy.Server/RustProxy.Server.csproj \
            -c Release -r "${{ matrix.rid }}" --self-contained false \
            -o "$output/server"
          dotnet publish RustProxy.Cli/RustProxy.Cli.csproj \
            -c Release -r "${{ matrix.rid }}" --self-contained false \
            -o "$output/cli"

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "RustProxy-${{ matrix.rid }}.zip" "${{ matrix.rid }}/*" >/dev/null
          else
            zip -qr "RustProxy-${{ matrix.rid }}.zip" "${{ matrix.rid }}"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustProxy-${{ matrix.rid }}
          path: artifacts/RustProxy-${{ matrix.rid }}.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && github.server_url == 'https://github.com'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/RustProxy-${{ matrix.rid }}.zip
          body_path: RELEASE_NOTES.md
          generate_release_notes: false

      - name: Attach to Gitea Release
        if: startsWith(github.ref, 'refs/tags/') && github.server_url != 'https://github.com'
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GITEA_TOKEN" ]]; then
            echo "Set the GITEA_TOKEN repository secret to upload release assets" >&2
            exit 1
          fi
          api_url="${{ github.api_url }}/repos/${{ github.repository }}/releases"
          release=$(curl --silent --show-error \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${GITHUB_REF_NAME}\",\"name\":\"${GITHUB_REF_NAME}\",\"draft\":false,\"prerelease\":false}" \
            "$api_url" || true)
          if [[ -z "$release" ]]; then
            release=$(curl --fail --silent --show-error \
              -H "Authorization: token $GITEA_TOKEN" \
              "$api_url/tags/${GITHUB_REF_NAME}")
          fi
          upload_url=$(printf '%s' "$release" | jq -r '.upload_url // empty' | sed 's/{?name,label}//')
          if [[ -z "$upload_url" ]]; then
            echo "Unable to find Gitea release upload URL" >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary "@artifacts/RustProxy-${{ matrix.rid }}.zip" \
            "$upload_url?name=RustProxy-${{ matrix.rid }}.zip"
