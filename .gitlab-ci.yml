image: mcr.microsoft.com/dotnet/sdk:11.0.100-rc.3

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - when: never

stages:
  - verify
  - package
  - release

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

cache:
  key:
    files:
      - RustProxy.Core/packages.lock.json
      - RustProxy.Server/packages.lock.json
  paths:
    - .nuget/packages/

verify:
  stage: verify
  timeout: 30m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'
  script:
    - dotnet --info
    - dotnet restore RustProxy.slnx --locked-mode --disable-build-servers
    - dotnet build RustProxy.slnx --configuration Release --no-restore --disable-build-servers -m:1 -p:UseSharedCompilation=false
    - dotnet test RustProxy.slnx --configuration Release --no-build --no-restore --disable-build-servers --logger "trx;LogFilePrefix=tests" --results-directory TestResults
    - git diff --check
  artifacts:
    when: always
    paths:
      - TestResults/**/*.trx
    expire_in: 14 days

publish:
  stage: package
  needs:
    - verify
  parallel:
    matrix:
      - RID: linux-x64
      - RID: linux-arm64
      - RID: win-x64
      - RID: osx-arm64
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
      variables:
        PACKAGE_VERSION: "$CI_COMMIT_TAG"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        PACKAGE_VERSION: "$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    - if: '$CI_COMMIT_BRANCH'
      variables:
        PACKAGE_VERSION: "$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
  script:
    - dotnet restore RustProxy.slnx --locked-mode
    - mkdir -p "artifacts/$RID/server" "artifacts/$RID/cli"
    - dotnet publish RustProxy.Server/RustProxy.Server.csproj --configuration Release --runtime "$RID" --self-contained false --no-restore --output "artifacts/$RID/server"
    - dotnet publish RustProxy.Cli/RustProxy.Cli.csproj --configuration Release --runtime "$RID" --self-contained false --no-restore --output "artifacts/$RID/cli"
    - tar -czf "RustProxy-${PACKAGE_VERSION}-${RID}.tar.gz" -C artifacts "$RID"
    - sha256sum "RustProxy-${PACKAGE_VERSION}-${RID}.tar.gz" > "RustProxy-${PACKAGE_VERSION}-${RID}.tar.gz.sha256"
  artifacts:
    name: "RustProxy-${PACKAGE_VERSION}-${RID}"
    paths:
      - "RustProxy-${PACKAGE_VERSION}-${RID}.tar.gz"
      - "RustProxy-${PACKAGE_VERSION}-${RID}.tar.gz.sha256"
    expire_in: 30 days

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:v1.128.0@sha256:00884510ffcbb6b03c0abc5dd058d7728a646cab2a419de4a7108d073ce90a03
  cache: []
  needs:
    - job: publish
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "RustProxy $CI_COMMIT_TAG"
    description: CHANGELOG.md
