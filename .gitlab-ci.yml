image: mcr.microsoft.com/dotnet/sdk:11.0.100-rc.3

stages:
  - verify
  - package
  - release

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

cache:
  key:
    files:
      - RustProxy.Core/RustProxy.Core.csproj
      - RustProxy.Server/RustProxy.Server.csproj
  paths:
    - .nuget/packages/

verify:
  stage: verify
  script:
    - dotnet --info
    - dotnet restore RustProxy.slnx
    - dotnet build RustProxy.slnx --configuration Release --no-restore
    - git diff --check

publish:
  stage: package
  needs:
    - verify
  parallel:
    matrix:
      - RID: linux-x64
      - RID: linux-arm64
      - RID: win-x64
      - RID: osx-arm64
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
      variables:
        PACKAGE_VERSION: "$CI_COMMIT_TAG"
    - if: '$CI_COMMIT_BRANCH'
      variables:
        PACKAGE_VERSION: "$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
  script:
    - dotnet restore RustProxy.slnx --runtime "$RID"
    - mkdir -p "artifacts/$RID/server" "artifacts/$RID/cli"
    - dotnet publish RustProxy.Server/RustProxy.Server.csproj --configuration Release --runtime "$RID" --self-contained false --no-restore --output "artifacts/$RID/server"
    - dotnet publish RustProxy.Cli/RustProxy.Cli.csproj --configuration Release --runtime "$RID" --self-contained false --no-restore --output "artifacts/$RID/cli"
    - tar -czf "RustProxy-${PACKAGE_VERSION}-${RID}.tar.gz" -C artifacts "$RID"
  artifacts:
    name: "RustProxy-${PACKAGE_VERSION}-${RID}"
    paths:
      - "RustProxy-${PACKAGE_VERSION}-${RID}.tar.gz"
    expire_in: 30 days

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  cache: []
  needs:
    - job: publish
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "RustProxy $CI_COMMIT_TAG"
    description: CHANGELOG.md
